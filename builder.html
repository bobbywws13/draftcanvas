<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DraftCanvas Studio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #f1f5f9; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
    .studio-nav { border-bottom: 1px solid #e2e8f0; background: #ffffff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; height: 57px; z-index: 50; }
    .logo-link { text-decoration: none; font-size: 20px; font-weight: 900; color: #059669; }
    .app-container { display: flex; width: 100vw; height: calc(100vh - 57px); overflow: hidden; flex-direction: column-reverse; }
    @media (min-width: 1024px) { .app-container { flex-direction: row; } }
    .config-sidebar { width: 100%; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; height: 50vh; }
    @media (min-width: 1024px) { .config-sidebar { width: 440px; height: 100%; flex-shrink: 0; border-right: 1px solid #e2e8f0; } }
    .sidebar-content { padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; flex: 1; }
    .section-title { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 0 0 4px 0; letter-spacing: 0.05em; }
    .grid-2 { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; }
    .stepper { display: flex; align-items: center; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px; }
    .btn-step { width: 34px; height: 34px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lbl-val { flex: 1; text-align: center; font-family: monospace; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 10px; font-size: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; text-transform: uppercase; }
    .theme-grid { display: grid; grid-template-cols: 1fr 1fr; gap: 6px; }
    .btn-theme { padding: 10px; font-size: 11px; font-weight: 600; text-align: left; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; }
    .roster-container { display: flex; flex-direction: column; gap: 6px; border: 1px solid #e2e8f0; padding: 8px; border-radius: 8px; background: #f8fafc; }
    .roster-row { display: flex; flex-direction: column; gap: 4px; background: white; border: 1px solid #e2e8f0; padding: 6px; border-radius: 6px; }
    .footer-card { padding: 16px 24px; border-top: 1px solid #e2e8f0; background: #ffffff; flex-shrink: 0; }
    .btn-main { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; text-align: center; display: block; text-decoration: none; }
    main { width: 100%; background: #0f172a; padding: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; height: 50vh; overflow: auto; }
    @media (min-width: 1024px) { main { height: 100%; flex: 1; background: #f1f5f9; padding: 32px; overflow: auto; align-items: flex-start; } }
    .canvas-container-outer { width: 100%; display: flex; align-items: flex-start; justify-content: center; position: relative; cursor: grab; min-height: min-content; }
    .canvas-wrap { width: 100%; max-width: 820px; height: auto; display: flex; align-items: center; justify-content: center; background: transparent; transform-origin: top center; position: relative; left: 0; top: 0; will-change: transform, left, top; margin-bottom: 40px; }
    @media (min-width: 1024px) { .canvas-wrap { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); margin-top: 10px; } }
    canvas { max-width: 100%; height: auto; aspect-ratio: 4/3; object-fit: contain; background: #020617; border-radius: 4px; pointer-events: none; }
  </style>
</head>
<body>
  <nav class="studio-nav"><a href="index.html" class="logo-link">DRAFTCANVAS</a></nav>
<div class="app-container">
  <aside class="config-sidebar">
    <div class="sidebar-content">
      <div>
        <div class="section-title">🔎 Board Zoom View</div>
        <input type="range" id="boardZoomSlider" min="100" max="300" value="100" style="width:100%; accent-color:#10b981;" oninput="adjustBoardZoom(this.value)">
      </div>
      <div>
        <div class="section-title">1. Board Dimensions</div>
        <div class="grid-2">
          <div><div class="stepper"><button onclick="updateTeams(-1)" class="btn-step">-</button><span id="lblTeams" class="lbl-val">12</span><button onclick="updateTeams(1)" class="btn-step">+</button></div></div>
          <div><div class="stepper"><button onclick="updateRounds(-1)" class="btn-step">-</button><span id="lblRounds" class="lbl-val">15</span><button onclick="updateRounds(1)" class="btn-step">+</button></div></div>
        </div>
      </div>
      <div>
        <div class="section-title">2. Headers & Main Logo</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <input type="text" id="inTitle" value="MY FANTASY LEAGUE" oninput="syncData()">
          <div class="grid-2">
            <input type="text" id="inDate" value="AUGUST 29TH" oninput="syncData()">
            <input type="text" id="inLoc" value="THE WAR ROOM" oninput="syncData()">
          </div>
          <input type="file" accept="image/*" onchange="uploadLeagueLogo(event)">
        </div>
      </div>
      <div>
        <div class="section-title">3. Football Themes</div>
        <div class="theme-grid">
          <button onclick="setTheme('stadium')" class="btn-theme">🏟️ Stadium</button>
          <button onclick="setTheme('gridiron')" class="btn-theme">🏈 Gridiron</button>
          <button onclick="setTheme('gold')" class="btn-theme">🏆 Gold</button>
          <button onclick="setTheme('carbon')" class="btn-theme">⚫ Carbon</button>
        </div>
      </div>
      <div>
        <div class="section-title">4. Franchise Roster Editor</div>
        <div id="rosterList" class="roster-container"></div>
      </div>
    </div>
    <div class="footer-card"><button onclick="addCustomBoardToCart()" class="btn-main">🛒 Add To Cart</button></div>
  </aside>
  <main><div id="panningOuterContainer" class="canvas-container-outer"><div id="interactiveCanvasWrap" class="canvas-wrap"><canvas id="canvasMain"></canvas></div></div></main>
</div>
<script>
  let board = { teams: 12, rounds: 15, title: "MY FANTASY LEAGUE", date: "AUGUST 29TH", location: "THE WAR ROOM", theme: "stadium", accentColor: "#10b981", leagueLogoImg: null, teamData: [] };
  let currentZoomScale = 1, currentLeft = 0, currentTop = 0;
  
  // LOOKS FOR YOUR EXACT FILENAME AND ENFORCES A LOAD SAFETY RE-TRIGGER
  const companyWatermarkImg = new Image();
  companyWatermarkImg.src = "DraftCanvas Logo - White w Transparent.png";
  
  companyWatermarkImg.onload = function() { 
    if(window.drawBoard) window.drawBoard(); 
  };
  
  // Re-trigger loop ensures that if the server delays, it listens for completion and draws it beautifully
  if (companyWatermarkImg.complete) {
    setTimeout(() => { if(window.drawBoard) window.drawBoard(); }, 500);
  }

  for (let i = 0; i < 20; i++) { board.teamData.push({ name: "TEAM " + (i + 1), customImage: null }); }
  function addCustomBoardToCart() { window.location.href = "index.html?viewcart=true&title=" + encodeURIComponent(board.title); }
  
  function adjustBoardZoom(val) {
    currentZoomScale = val / 100;
    const targetWrap = document.getElementById('interactiveCanvasWrap');
    if (targetWrap) {
      targetWrap.style.transform = `scale(${currentZoomScale})`;
      if (currentZoomScale === 1) { targetWrap.style.left = "0px"; targetWrap.style.top = "0px"; currentLeft = 0; currentTop = 0; }
    }
  }
  function updateTeams(amt) { board.teams = Math.max(8, Math.min(20, board.teams + amt)); document.getElementById('lblTeams').innerText = board.teams; rebuildRosterUI(); window.drawBoard(); }
  function updateRounds(amt) { board.rounds = Math.max(10, Math.min(20, board.rounds + amt)); document.getElementById('lblRounds').innerText = board.rounds; window.drawBoard(); }
  function setTheme(id) { board.theme = id; window.drawBoard(); }
  function syncData() { board.title = document.getElementById('inTitle').value.toUpperCase(); board.date = document.getElementById('inDate').value.toUpperCase(); board.location = document.getElementById('inLoc').value.toUpperCase(); window.drawBoard(); }
  function syncTeamName(idx, val) { board.teamData[idx].name = val.toUpperCase(); window.drawBoard(); }
  function uploadLeagueLogo(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { board.leagueLogoImg = img; window.drawBoard(); }; img.src = e.target.result; }; reader.readAsDataURL(file); }
  function uploadTeamLogo(event, idx) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { board.teamData[idx].customImage = img; window.drawBoard(); }; img.src = e.target.result; }; reader.readAsDataURL(file); }
  
  function rebuildRosterUI() {
    const container = document.getElementById('rosterList'); if (!container) return; container.innerHTML = "";
    for (let i = 0; i < board.teams; i++) {
      let row = document.createElement('div'); row.className = "roster-row";
      row.innerHTML = `<div style="display:flex; align-items:center; gap:8px;"><span style="font-size:11px; font-family:monospace; font-weight:bold; color:#94a3b8; width:16px;">${i+1}</span><input type="text" value="${board.teamData[i].name}" oninput="syncTeamName(${i}, this.value)"></div><input type="file" accept="image/*" onchange="uploadTeamLogo(event, ${i})" style="font-size:9px; margin-left:24px;">`;
      container.appendChild(row);
    }
  }
  function drawImageCropped(ctx, img, targetX, targetY, targetW, targetH) { const imgW = img.width, imgH = img.height, imgRatio = imgW / imgH, targetRatio = targetW / targetH; let sourceX = 0, sourceY = 0, sourceW = imgW, sourceH = imgH; if (imgRatio > targetRatio) { sourceW = imgH * targetRatio; sourceX = (imgW - sourceW) / 2; } else { sourceH = imgW / targetRatio; sourceY = (imgH - sourceH) / 2; } ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, targetX, targetY, targetW, targetH); }

  document.addEventListener("DOMContentLoaded", function() {
    const canvas = document.getElementById('canvasMain'); if (!canvas) return; const ctx = canvas.getContext('2d'); canvas.width = 1600; canvas.height = 1200;
    const margin = 60, leftMarginOffset = 100, bannerBoxHeight = 160, gridTopY = margin + bannerBoxHeight + 30, headerHeight = 65, gridBodyTopY = gridTopY + headerHeight;
    
    window.drawBoard = function() {
      const usableW = canvas.width - margin - leftMarginOffset, colW = usableW / board.teams, rowH = (canvas.height - gridBodyTopY - margin) / board.rounds; ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (board.theme === 'stadium') { let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 900); grad.addColorStop(0, '#334155'); grad.addColorStop(1, '#0f172a'); ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      else if (board.theme === 'gridiron') { ctx.fillStyle = '#16a34a'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      else if (board.theme === 'gold') { ctx.fillStyle = '#262626'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      else if (board.theme === 'carbon') { ctx.fillStyle = '#171717'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      ctx.strokeStyle = board.accentColor; ctx.lineWidth = 8; ctx.strokeRect(margin/2, margin/2, canvas.width - margin, canvas.height - margin);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.55)'; ctx.fillRect(leftMarginOffset, margin, canvas.width - margin - leftMarginOffset, bannerBoxHeight);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 2; ctx.strokeRect(leftMarginOffset, margin, canvas.width - margin - leftMarginOffset, bannerBoxHeight);
      if (board.leagueLogoImg) { drawImageCropped(ctx, board.leagueLogoImg, leftMarginOffset + 25, margin + 25, 110, 110); }
      
      // TITLE AND SUBTITLE SYSTEM
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#ffffff"; ctx.font = "500 50px system-ui, sans-serif"; 
      ctx.fillText(board.title || "MY LEAGUE", (canvas.width - margin + leftMarginOffset) / 2, margin + 42);
      ctx.fillStyle = "rgba(255, 255, 255, 0.22)"; ctx.font = "900 24px system-ui, sans-serif";
      ctx.fillText("DRAFT BOARD", (canvas.width - margin + leftMarginOffset) / 2, margin + 82);
      ctx.fillStyle = board.accentColor; ctx.fillRect((canvas.width - margin + leftMarginOffset) / 2 - 120, margin + 104, 240, 3);
      ctx.fillStyle = "#cbd5e1"; ctx.font = "500 14px monospace"; 
      ctx.fillText("DATE: " + board.date + "       LOCATION: " + board.location, (canvas.width - margin + leftMarginOffset) / 2, margin + 126);
      
      // ABSOLUTE FOREGROUND IMAGE DRAW COMMANDS
      const targetLogoW = 200, targetLogoH = 85;
      const targetLogoX = canvas.width - margin - targetLogoW - 35;
      const targetLogoY = margin + (bannerBoxHeight - targetLogoH) / 2;

      if (companyWatermarkImg.complete && companyWatermarkImg.naturalWidth !== 0) {
        ctx.drawImage(companyWatermarkImg, targetLogoX, targetLogoY, targetLogoW, targetLogoH);
      }
      
      // GRID GENERATOR MATRIX
      for (let i = 0; i < board.teams; i++) {
        const colX = leftMarginOffset + (i * colW); ctx.fillStyle = i % 2 === 0 ? "rgba(255, 255, 255, 0.03)" : "rgba(0, 0, 0, 0.25)"; ctx.fillRect(colX, gridBodyTopY, colW, canvas.height - gridBodyTopY - margin);
        ctx.fillStyle = i % 2 === 0 ? "#1e293b" : "#111827"; ctx.fillRect(colX, gridTopY, colW, headerHeight);
        if (board.teamData[i].customImage) { drawImageCropped(ctx, board.teamData[i].customImage, colX + (colW/2) - 13, gridTopY + 9, 26, 26); }
        ctx.fillStyle = "#f1f5f9"; ctx.font = "500 11px monospace"; ctx.fillText(board.teamData[i].name, colX + (colW / 2), gridTopY + 48, colW - 10);
      }
      for (let r = 0; r <= board.rounds; r++) {
        const rowY = gridBodyTopY + (r * rowH); ctx.strokeStyle = "rgba(255, 255, 255, 0.04)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(leftMarginOffset, rowY); ctx.lineTo(canvas.width - margin, rowY); ctx.stroke();
        if (r < board.rounds) { ctx.textAlign = "right"; ctx.fillStyle = "#cbd5e1"; ctx.font = "bold 13px monospace"; ctx.fillText((r + 1), leftMarginOffset - 20, rowY + (rowH / 2)); }
      }
    };
    
    const panZone = document.getElementById('panningOuterContainer'); const dragTarget = document.getElementById('interactiveCanvasWrap');
    let isDragging = false; let startX = 0, startY = 0;
    function handleDragStart(e) { if (currentZoomScale <= 1) return; isDragging = true; const pageX = e.pageX || (e.touches && e.touches[0].pageX); const pageY = e.pageY || (e.touches && e.touches[0].pageY); startX = pageX - currentLeft; startY = pageY - currentTop; }
    function handleDragMove(e) { if (!isDragging) return; e.preventDefault(); const pageX = e.pageX || (e.touches && e.touches[0].pageX); const pageY = e.pageY || (e.touches && e.touches[0].pageY); currentLeft = pageX - startX; currentTop = pageY - startY; dragTarget.style.left = currentLeft + "px"; dragTarget.style.top = currentTop + "px"; }
    function handleDragEnd() { isDragging = false; }
    panZone.addEventListener('mousedown', handleDragStart); window.addEventListener('mousemove', handleDragMove); window.addEventListener('mouseup', handleDragEnd);
    rebuildRosterUI(); window.drawBoard();
  });
</script>
</body>
</html>
